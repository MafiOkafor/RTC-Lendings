<!doctype html>
<html lang="en">
<head>
  <!-- Page identity and styles. This portal's CSS loads after shared components. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Application queue | RTC Lendings</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/portal-components.css">
  <link rel="stylesheet" href="./css/admin.css">
  <script type="module" src="./js/dashboard.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <!-- Portal navigation and session actions. -->
  <header>
    <a class="brand" href="../index.html"><span class="mark">RTC</span> Lendings</a>
    <nav aria-label="Portal navigation">
      <a href="dashboard.html">Applications</a>
      <a href="clients.html">Clients</a>
      <a href="business.html" data-owner hidden>Business</a>
      <a href="interest.html" data-owner hidden>Interest</a>
      <a href="employees.html" data-owner hidden>Employees</a>
      <button type="button" class="small-button" data-signout hidden>Sign out</button>
    </nav>
  </header>
  <main id="main" class="portal">
    <p class="eyebrow">STAFF PORTAL</p>
    <h1>Application queue</h1>
    <!-- Errors and save results are announced to screen readers. -->
    <p data-status class="status" role="status" aria-live="polite">Loading your account…</p>
    <noscript>Please enable JavaScript to use this portal.</noscript>
    <!-- Content stays hidden until the session and page data are verified. -->
    <div data-content hidden>
      <!-- Filter the latest 100 records by workflow stage. -->
      <form class="card filter" data-filter><label for="stage">Stage</label>
        <select id="stage" name="stage"><option value="">All stages</option><option value="submitted">submitted</option><option value="affordability">affordability</option><option value="documents">documents</option><option value="review">review</option><option value="approved">approved</option><option value="rejected">rejected</option><option value="agreement_accepted">agreement accepted</option><option value="disbursed">disbursed</option><option value="completed">completed</option></select>
        <button type="submit">Apply filter</button>
      </form>
      <p>Latest 100 matching applications. Open a record to review it or record a payment.</p>
      <div class="table-wrap card" data-applications></div>
    </div>
  </main>
  <footer><a href="../index.html">RTC Lendings</a><span>South Africa · Amounts in ZAR</span></footer>
</body>
</html>
