<!doctype html>
<html lang="en">
<head>
  <!-- Page identity and styles. This portal's CSS loads after shared components. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Supporting documents | RTC Lendings</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/portal-components.css">
  <link rel="stylesheet" href="./css/customer.css">
  <script type="module" src="./js/documents.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <!-- Portal navigation and session actions. -->
  <header>
    <a class="brand" href="../index.html"><span class="mark">RTC</span> Lendings</a>
    <nav aria-label="Portal navigation">
      <a href="dashboard.html">My account</a>
      <a href="profile.html">My profile</a>
      <a href="apply.html">Apply</a>
      <button type="button" class="small-button" data-signout hidden>Sign out</button>
    </nav>
  </header>
  <main id="main" class="portal">
    <p class="eyebrow">CUSTOMER PORTAL</p>
    <h1>Supporting documents</h1>
    <!-- Errors and save results are announced to screen readers. -->
    <p data-status class="status" role="status" aria-live="polite">Loading your account…</p>
    <noscript>Please enable JavaScript to use this portal.</noscript>
    <!-- Content stays hidden until the session and page data are verified. -->
    <div data-content hidden>
      <a data-back href="dashboard.html">Back to your application</a>
      <!-- Private uploads are available only during the review stages. -->
      <form class="card form-page" data-upload>
        <fieldset data-upload-fields><legend>Upload a document</legend>
        <label for="kind">Document type</label>
        <select id="kind" name="kind" required><option value="identity">Identity document</option><option value="income">Proof of income</option><option value="bank_statement">Bank statement</option></select>
        <label for="document">PDF, JPG or PNG — maximum 10 MB</label>
        <input id="document" name="document" type="file" accept="application/pdf,image/jpeg,image/png" required>
        <button type="submit">Upload for verification</button>
        </fieldset>
      </form>
      <section class="card"><h2>Your uploaded documents</h2><div class="table-wrap" data-documents></div></section>
    </div>
  </main>
  <footer><a href="../index.html">RTC Lendings</a><span>South Africa · Amounts in ZAR</span></footer>
</body>
</html>
